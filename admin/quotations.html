<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotations | Future Homes Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body" data-admin="quotations" data-title="Quotation Management" data-sub="Generate plot and flat quotations" data-wa="off">

<div class="admin-shell" id="adminShell">
  <aside class="admin-side" id="adminSide"></aside>
  <div class="admin-main">
    <header class="admin-top" id="adminTop"></header>
    <main class="admin-content">
      <div class="admin-page-head">
        <div><h1>Quotations</h1><p>Prepare pricing, apply discount and share a quotation with the customer.</p></div>
      </div>

      <div class="admin-grid-2">
        <div class="panel">
          <div class="panel__head"><h3>Create Quotation</h3></div>
          <div class="panel__body form-grid">
            <div class="field"><label for="qtCustomer">Customer Name</label><input class="input" id="qtCustomer" placeholder="Customer name"></div>
            <div class="form-row">
              <div class="field"><label for="qtType">Unit Type</label><select class="select" id="qtType"><option>Plot</option><option>Flat</option></select></div>
              <div class="field"><label for="qtProject">Project</label><select class="select" id="qtProject"></select></div>
            </div>
            <div class="field"><label for="qtUnit">Plot / Flat</label><select class="select" id="qtUnit"></select></div>
            <div class="form-row">
              <div class="field"><label for="qtArea">Area (Sq.Ft.)</label><input class="input" id="qtArea" type="number" value="0"></div>
              <div class="field"><label for="qtRate">Rate / Sq.Ft.</label><input class="input" id="qtRate" type="number" value="0"></div>
            </div>
            <div class="form-row">
              <div class="field"><label for="qtOther">Other Charges</label><input class="input" id="qtOther" type="number" value="0"></div>
              <div class="field"><label for="qtDiscount">Discount</label><input class="input" id="qtDiscount" type="number" value="0"></div>
            </div>
            <div class="detail-list" style="border-top:1px solid var(--border);padding-top:12px">
              <div><dt>Base Price</dt><dd><b id="qtBase">&#8377;0</b></dd></div>
              <div><dt>Final Amount</dt><dd><b id="qtFinal" style="color:var(--blue)">&#8377;0</b></dd></div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <button class="btn btn--primary" type="button" id="qtGenerate" data-magnetic>Generate Quotation</button>
              <button class="btn btn--ghost" type="button" id="qtDownload" data-magnetic>Download</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel__head"><h3>Recent Quotations</h3></div>
          <div class="table-wrap" style="border:none;border-radius:0">
            <table class="data" style="min-width:520px">
              <thead><tr><th>Ref</th><th>Customer</th><th>Unit</th><th>Final</th><th>Action</th></tr></thead>
              <tbody id="adminQuotationsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="admin-backdrop"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/pdf-helper.js"></script>
<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
